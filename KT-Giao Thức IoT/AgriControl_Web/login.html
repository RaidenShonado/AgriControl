<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - AgriControl</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img src="icon-64x64.png" alt="AgriControl" />
      <div class="name">AgriControl</div>
    </div>

    <div class="auth-card">
      <div class="auth-title">Đăng nhập</div>
<div id="already" style="display:none;">
        <div class="alert alert-info mt-3 mb-3" role="alert" style="border-radius: 14px;">
          Bạn đang đăng nhập sẵn với: <b id="already-label">---</b>
        </div>
        <div class="d-grid gap-2">
          <button id="continue-btn" class="btn btn-primary">Vào Dashboard</button>
          <button id="switch-btn" class="btn btn-outline-secondary">Đăng xuất / Đổi tài khoản</button>
        </div>
        
      </div>

      <form id="login-form" style="display:none;" autocomplete="on">
        <div class="mt-3">
          <label class="form-label">Email</label>
          <input id="email" class="form-control" type="email" placeholder="email@example.com" autocomplete="username" />
        </div>
        <div class="mt-3">
          <label class="form-label">Mật khẩu</label>
          <input id="password" class="form-control" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div id="err" class="auth-error" style="display:none;"></div>

        <div class="d-grid gap-2 mt-3">
          <button id="login-btn" type="submit" class="btn btn-primary">Đăng nhập</button>
          <button id="guest-btn" type="button" class="btn btn-outline-secondary">Vào nhanh (Anonymous)</button>
        </div>

        
      </form>
    </div>

    <div class="text-center mt-3" style="color:#94a3b8; font-size:.85rem;">
      © AgriControl
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInAnonymously, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCfSGNCGJiMyj6vOothpfycJAyJvxhojDI",
      authDomain: "argicontrol.firebaseapp.com",
      databaseURL: "https://argicontrol-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "argicontrol",
      storageBucket: "argicontrol.firebasestorage.app",
      messagingSenderId: "944915931120",
      appId: "1:944915931120:web:267e5a0fb996d5bb308735"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Make session less "sticky": keep auth only for this tab/session.
    // (Giảm tình trạng "mở web là tự vào dashboard" do còn phiên đăng nhập cũ.)
    await setPersistence(auth, browserSessionPersistence);

    const alreadyBox = document.getElementById('already');
    const alreadyLabel = document.getElementById('already-label');
    const loginForm = document.getElementById('login-form');
    const errEl = document.getElementById('err');

    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');

    const continueBtn = document.getElementById('continue-btn');
    const switchBtn = document.getElementById('switch-btn');
    const guestBtn = document.getElementById('guest-btn');

    function showErr(msg){
      errEl.style.display = 'block';
      errEl.textContent = msg;
    }
    function clearErr(){
      errEl.style.display = 'none';
      errEl.textContent = '';
    }

    function authErrorMessage(e){
      const code = (e && e.code) ? String(e.code) : '';
      switch (code) {
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          return 'Email hoặc mật khẩu không đúng.';
        case 'auth/invalid-email':
          return 'Email không hợp lệ.';
        case 'auth/user-disabled':
          return 'Tài khoản đã bị vô hiệu hóa.';
        case 'auth/too-many-requests':
          return 'Bạn thử quá nhiều lần. Vui lòng đợi một chút rồi thử lại.';
        case 'auth/network-request-failed':
          return 'Lỗi mạng. Vui lòng kiểm tra Internet rồi thử lại.';
        case 'auth/operation-not-allowed':
          return 'Phương thức đăng nhập này chưa được bật trên Firebase Console.';
        default:
          return 'Đăng nhập thất bại. Vui lòng thử lại.';
      }
    }

    onAuthStateChanged(auth, (user) => {
      clearErr();
      if (user) {
        // KHÔNG auto redirect. User tự bấm "Vào Dashboard".
        const label = user.isAnonymous ? 'Anonymous' : (user.email || 'User');
        alreadyLabel.textContent = label;
        alreadyBox.style.display = 'block';
        loginForm.style.display = 'none';
      } else {
        alreadyBox.style.display = 'none';
        loginForm.style.display = 'block';
      }
    });

    if (continueBtn) continueBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    if (switchBtn) switchBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (e) {
        console.error('[Auth] signOut error:', e);
      }
    });

    if (loginForm) loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErr();
      const email = (emailEl.value || '').trim();
      const password = passEl.value || '';
      if (!email || !password) {
        showErr('Vui lòng nhập Email và Mật khẩu.');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Sau khi login thành công, sẽ chuyển sang trạng thái "đã đăng nhập" và người dùng tự bấm "Vào Dashboard".
      } catch (e) {
        console.error('[Auth] Email/Password error:', e);
        showErr(authErrorMessage(e));
      }
    });

    if (guestBtn) guestBtn.addEventListener('click', async () => {
      clearErr();
      try {
        await signInAnonymously(auth);
      } catch (e) {
        console.error('[Auth] Anonymous error:', e);
        showErr(authErrorMessage(e));
      }
    });
  </script>
</body>
</html>
